[metadata]
name = napari-cool-tools-dev
version = 0.0.1
description = Development tools

[options]
packages = find:
install_requires =
    numpy
    qtreload

python_requires = >=3.8
include_package_data = True
package_dir =
    =src

[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    napari-cool-tools-dev = napari_cool_tools_dev:napari.yaml

[options.package_data]
* = *.yaml
